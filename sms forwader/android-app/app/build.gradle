plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.kapt)
    alias(libs.plugins.hilt)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.smsforwarder.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.smsforwarder.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField "String", "BACKEND_BASE_URL", "\"https://smsai.ashtrinox.in/\""
        buildConfigField "int", "PROTOCOL_VERSION", "1"
        buildConfigField "long", "MESSAGE_EXPIRY_HOURS", "24L"
        buildConfigField "long", "MAX_MESSAGE_AGE_MINUTES", "5L"
        buildConfigField "int", "MAX_RETRY_ATTEMPTS", "10"
    }

    buildTypes {
        debug {
            debuggable true
            buildConfigField "String", "BACKEND_BASE_URL", "\"https://smsai.ashtrinox.in/\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core AndroidX
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.vm

    // Jetpack Compose & Material 3
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.extended
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    // Navigation
    implementation libs.navigation.compose

    // Hilt DI
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    implementation libs.hilt.navigation.compose
    implementation libs.hilt.work
    kapt libs.hilt.work.compiler

    // Networking (Retrofit + OkHttp)
    implementation libs.retrofit.core
    implementation libs.retrofit.kotlinx.serialization
    implementation libs.okhttp.core
    implementation libs.okhttp.logging

    // Serialization
    implementation libs.kotlinx.serialization.json

    // Room DB
    implementation libs.room.runtime
    implementation libs.room.ktx
    kapt libs.room.compiler

    // WorkManager (Offline queue retry)
    implementation libs.work.runtime.ktx

    // Android KeyStore & Security
    implementation libs.security.crypto
    implementation libs.datastore.preferences

    // Firebase (FCM)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging.ktx

    // ZXing (QR Code generation & barcode scanning)
    implementation libs.zxing.core
    implementation libs.zxing.embedded

    // Coroutines
    implementation libs.coroutines.android

    // Unit Tests
    testImplementation libs.junit
    testImplementation libs.mockk
    testImplementation libs.coroutines.test
    testImplementation libs.turbine

    // Instrumentation Tests
    androidTestImplementation libs.junit.ext
    androidTestImplementation libs.espresso.core
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.ui.test.junit4
}

kapt {
    correctErrorTypes = true
}
