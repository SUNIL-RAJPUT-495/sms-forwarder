[versions]
# Core Android / Kotlin
agp                 = "8.5.2"
kotlin              = "2.0.21"
ksp                 = "2.0.21-1.0.27"
coreKtx             = "1.13.1"
lifecycleRuntime    = "2.8.7"
activityCompose     = "1.9.3"
composeBom          = "2024.12.01"

# Hilt (Dependency Injection)
hilt                = "2.52"
hiltNavigationCompose = "1.2.0"

# Navigation
navigationCompose   = "2.8.5"

# Networking
retrofit            = "2.11.0"
okhttp              = "4.12.0"

# Serialization
kotlinxSerializationJson = "1.7.3"

# Room (local database)
room                = "2.6.1"

# WorkManager
workManager         = "2.10.0"

# Security / EncryptedSharedPreferences
securityCrypto     = "1.1.0-alpha06"

# Firebase
googleServices      = "4.4.2"
firebaseBom         = "33.7.0"

# ZXing (QR display/scan)
zxingCore           = "3.5.3"
zxingAndroid        = "4.3.0"

# DataStore
datastore           = "1.1.1"

# Coroutines
coroutines          = "1.9.0"

# Testing
junit               = "4.13.2"
junitExt            = "1.2.1"
espresso            = "3.6.1"
mockk               = "1.13.12"
turbine             = "1.2.0"

[libraries]
# AndroidX Core
androidx-core-ktx          = { group = "androidx.core",               name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle",           name = "lifecycle-runtime-ktx",        version.ref = "lifecycleRuntime" }
androidx-activity-compose  = { group = "androidx.activity",            name = "activity-compose",             version.ref = "activityCompose" }
androidx-lifecycle-vm       = { group = "androidx.lifecycle",           name = "lifecycle-viewmodel-compose",  version.ref = "lifecycleRuntime" }

# Compose
compose-bom                = { group = "androidx.compose",             name = "compose-bom",                  version.ref = "composeBom" }
compose-ui                 = { group = "androidx.compose.ui",          name = "ui"                           }
compose-ui-graphics        = { group = "androidx.compose.ui",          name = "ui-graphics"                  }
compose-ui-tooling-preview = { group = "androidx.compose.ui",          name = "ui-tooling-preview"           }
compose-material3          = { group = "androidx.compose.material3",   name = "material3"                    }
compose-ui-tooling         = { group = "androidx.compose.ui",          name = "ui-tooling"                   }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-test-manifest   = { group = "androidx.compose.ui",          name = "ui-test-manifest"             }
compose-ui-test-junit4     = { group = "androidx.compose.ui",          name = "ui-test-junit4"               }

# Navigation
navigation-compose         = { group = "androidx.navigation",          name = "navigation-compose",           version.ref = "navigationCompose" }

# Hilt
hilt-android               = { group = "com.google.dagger",            name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler              = { group = "com.google.dagger",            name = "hilt-android-compiler",        version.ref = "hilt" }
hilt-navigation-compose    = { group = "androidx.hilt",                name = "hilt-navigation-compose",      version.ref = "hiltNavigationCompose" }
hilt-work                  = { group = "androidx.hilt",                name = "hilt-work",                    version = "1.2.0" }
hilt-work-compiler         = { group = "androidx.hilt",                name = "hilt-compiler",                version = "1.2.0" }

# Networking
retrofit-core              = { group = "com.squareup.retrofit2",       name = "retrofit",                     version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version = "1.0.0" }
okhttp-core                = { group = "com.squareup.okhttp3",         name = "okhttp",                       version.ref = "okhttp" }
okhttp-logging             = { group = "com.squareup.okhttp3",         name = "logging-interceptor",          version.ref = "okhttp" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",   version.ref = "kotlinxSerializationJson" }

# Room
room-runtime               = { group = "androidx.room",                name = "room-runtime",                 version.ref = "room" }
room-ktx                   = { group = "androidx.room",                name = "room-ktx",                     version.ref = "room" }
room-compiler              = { group = "androidx.room",                name = "room-compiler",                 version.ref = "room" }

# WorkManager
work-runtime-ktx           = { group = "androidx.work",                name = "work-runtime-ktx",             version.ref = "workManager" }

# Security
security-crypto            = { group = "androidx.security",            name = "security-crypto",               version.ref = "securityCrypto" }

# Firebase
firebase-bom               = { group = "com.google.firebase",          name = "firebase-bom",                  version.ref = "firebaseBom" }
firebase-messaging-ktx     = { group = "com.google.firebase",          name = "firebase-messaging-ktx"        }
firebase-analytics-ktx     = { group = "com.google.firebase",          name = "firebase-analytics-ktx"        }

# ZXing
zxing-core                 = { group = "com.google.zxing",             name = "core",                          version.ref = "zxingCore" }
zxing-embedded             = { group = "com.journeyapps",              name = "zxing-android-embedded",        version.ref = "zxingAndroid" }

# DataStore
datastore-preferences      = { group = "androidx.datastore",           name = "datastore-preferences",         version.ref = "datastore" }

# Coroutines
coroutines-android         = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-android",    version.ref = "coroutines" }
coroutines-test            = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-test",       version.ref = "coroutines" }

# Testing
junit                      = { group = "junit",                        name = "junit",                         version.ref = "junit" }
junit-ext                  = { group = "androidx.test.ext",            name = "junit",                         version.ref = "junitExt" }
espresso-core              = { group = "androidx.test.espresso",       name = "espresso-core",                 version.ref = "espresso" }
mockk                      = { group = "io.mockk",                     name = "mockk",                         version.ref = "mockk" }
turbine                    = { group = "app.cash.turbine",             name = "turbine",                       version.ref = "turbine" }

[plugins]
android-application        = { id = "com.android.application",         version.ref = "agp" }
kotlin-android             = { id = "org.jetbrains.kotlin.android",    version.ref = "kotlin" }
kotlin-compose            = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt                = { id = "org.jetbrains.kotlin.kapt",       version.ref = "kotlin" }
hilt                       = { id = "com.google.dagger.hilt.android",  version.ref = "hilt" }
kotlin-serialization       = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services            = { id = "com.google.gms.google-services",  version.ref = "googleServices" }
