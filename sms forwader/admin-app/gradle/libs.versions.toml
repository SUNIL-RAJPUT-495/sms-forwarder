[versions]
agp                 = "8.5.2"
kotlin              = "2.0.21"
coreKtx             = "1.13.1"
lifecycleRuntime    = "2.8.7"
activityCompose     = "1.9.3"
composeBom          = "2024.12.01"
hilt                = "2.52"
hiltNavigationCompose = "1.2.0"
navigationCompose   = "2.8.5"
retrofit            = "2.11.0"
okhttp              = "4.12.0"
kotlinxSerializationJson = "1.7.3"
googleServices      = "4.4.2"
coroutines          = "1.9.0"

[libraries]
androidx-core-ktx          = { group = "androidx.core",               name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle",           name = "lifecycle-runtime-ktx",        version.ref = "lifecycleRuntime" }
androidx-activity-compose  = { group = "androidx.activity",            name = "activity-compose",             version.ref = "activityCompose" }
androidx-lifecycle-vm       = { group = "androidx.lifecycle",           name = "lifecycle-viewmodel-compose",  version.ref = "lifecycleRuntime" }

compose-bom                = { group = "androidx.compose",             name = "compose-bom",                  version.ref = "composeBom" }
compose-ui                 = { group = "androidx.compose.ui",          name = "ui"                           }
compose-ui-graphics        = { group = "androidx.compose.ui",          name = "ui-graphics"                  }
compose-ui-tooling-preview = { group = "androidx.compose.ui",          name = "ui-tooling-preview"           }
compose-material3          = { group = "androidx.compose.material3",   name = "material3"                    }
compose-ui-tooling         = { group = "androidx.compose.ui",          name = "ui-tooling"                   }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

navigation-compose         = { group = "androidx.navigation",          name = "navigation-compose",           version.ref = "navigationCompose" }

hilt-android               = { group = "com.google.dagger",            name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler              = { group = "com.google.dagger",            name = "hilt-android-compiler",        version.ref = "hilt" }
hilt-navigation-compose    = { group = "androidx.hilt",                name = "hilt-navigation-compose",      version.ref = "hiltNavigationCompose" }

retrofit-core              = { group = "com.squareup.retrofit2",       name = "retrofit",                     version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version = "1.0.0" }
okhttp-core                = { group = "com.squareup.okhttp3",         name = "okhttp",                       version.ref = "okhttp" }
okhttp-logging             = { group = "com.squareup.okhttp3",         name = "logging-interceptor",          version.ref = "okhttp" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",   version.ref = "kotlinxSerializationJson" }

coroutines-android         = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-android",    version.ref = "coroutines" }

[plugins]
android-application        = { id = "com.android.application",         version.ref = "agp" }
kotlin-android             = { id = "org.jetbrains.kotlin.android",    version.ref = "kotlin" }
kotlin-compose            = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt                = { id = "org.jetbrains.kotlin.kapt",       version.ref = "kotlin" }
hilt                       = { id = "com.google.dagger.hilt.android",  version.ref = "hilt" }
kotlin-serialization       = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services            = { id = "com.google.gms.google-services",  version.ref = "googleServices" }
